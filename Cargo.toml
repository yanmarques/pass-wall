[package]
name = "pass-wall"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.97"
argon2 = "0.5.3"
axum = { version = "0.8.4", default-features = false, features = ["form", "http1", "http2", "matched-path", "multipart", "original-uri", "tokio", "tower-log", "tracing", "ws", "query"] }
axum-extra = { version = "0.10.1", default-features = false, features = ["cookie", "typed-header"] }
bytes = { version = "1.10.1", default-features = false }
clap = { version = "=4.5.41", features = ["derive"] }
cookie = { version = "0.18.1", default-features = false, features = ["percent-encode"] }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
hyper = { version = "1.6.0", default-features = false }
jsonwebtoken = { version = "9.3.1", default-features = false }
rand = { version = "0.9.0", default-features = false, features = ["os_rng"] }
rpassword = "7.4.0"
rustc-hash = "2.1.1"
serde = { version = "1.0.219", default-features = false }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.44.1", default-features = false, features = ["macros", "net", "rt", "rt-multi-thread", "time", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[dev-dependencies]
criterion = "0.5.1"
hashbrown = "0.15.2"
heapless = "0.8.0"
rand = "0.9.0"
reqwest = { version = "0.12.23", features = ["cookies"] }
tempfile = "3.23.0"
testcontainers = "0.25.0"
tokio = { version = "1.44.1", default-features = false, features = ["test-util", "process"] }
tower = "0.5.2"

[[bench]]
name = "map_benchmark"
harness = false
