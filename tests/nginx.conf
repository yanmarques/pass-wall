user  root root;
worker_processes  auto;

error_log  /dev/stderr  info;
pid /run/nginx.pid;

events {
    worker_connections   64;
}

http {
    default_type  text/html;


    log_format main      '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         '"$gzip_ratio"';

	upstream authserver {
		server passwall:9000;
	}

    server {
        listen        80;
        server_name   sub-a.example.com;

        access_log   /dev/stdout  main;

        location /favicon.ico {
		return 404;
	}

        location / {
		auth_request /authenticate;
		error_page 401 =302 http://auth.example.com/?redirect=$scheme://$host$request_uri;
		try_files "" @success;
        }

	location @success {
		return 200 '<div id="page">sub-a</div>';
	}

        location = /authenticate {
		internal;
		
		proxy_set_header X-Original-Url $scheme://$host$request_uri;
	
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";

		proxy_pass http://authserver/authenticate;
        }
    }

    server {
        listen        80;
        server_name   sub-b.example.com;

        access_log   /dev/stdout  main;

        location /favicon.ico {
		return 404;
	}

        location / {
		auth_request /authenticate;
		error_page 401 =302 http://auth.example.com/?redirect=$scheme://$host$request_uri;
		try_files "" @success;
        }

	location @success {
		return 200 '<div id="page">sub-b</div>';
	}

        location = /authenticate {
		internal;
		
		proxy_set_header X-Original-Url $scheme://$host$request_uri;
	
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";

		proxy_pass http://authserver/authenticate;
        }
    }

    server {
        listen        80;
        server_name   sub-c.example.com;

        access_log   /dev/stdout  main;

        location /favicon.ico {
		return 404;
	}

        location / {
		auth_request /authenticate;
		error_page 401 =302 http://$server_name/passwall/?redirect=$scheme://$host$request_uri;
		try_files "" @success;
        }

	location @success {
		return 200 '<div id="page">sub-c</div>';
	}

        location /passwall/ {
		proxy_pass http://authserver;
        }

        location = /authenticate {
		internal;
		
		proxy_set_header X-Original-Url $scheme://$host$request_uri;
	
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";

		proxy_pass http://authserver/passwall/authenticate;
        }
    }

    server {
        listen        80;
        server_name   auth.example.com;

        access_log   /dev/stdout  main;

        location /favicon.ico {
		return 404;
	}

	location / {
		proxy_pass http://authserver$request_uri;
	}
    }
}
