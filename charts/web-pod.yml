---
apiVersion: v1
kind: Namespace
metadata:
  name: web
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: web
  labels:
    app: web
spec:
  containers:
  - name: nginx
    image: nginx:1.14.2
    ports:
    - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: web
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://pass-wall.pass-wall.svc.cluster.local/authenticate
    nginx.ingress.kubernetes.io/auth-signin: 'http://auth.example.com:8080'
    nginx.ingress.kubernetes.io/auth-signin-redirect-param: redirect
    nginx.ingress.kubernetes.io/auth-cache-key: '$http_cookie'
spec:
  ingressClassName: nginx
  rules:
  - host: private.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: 
            name: web
            port: 
              number: 80
